name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WARN_CFLAGS: -O2 -std=c11 -Wall -Wextra -Wpedantic -Werror

jobs:
  x86-64:
    name: x86-64 ${{ matrix.cc }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v5
      - name: CPU
        run: |
          $CC --version | head -n 1
          grep -m1 'model name' /proc/cpuinfo
          for f in avx512f avx512bw vaes; do grep -qw $f /proc/cpuinfo && echo "$f: yes" || echo "$f: no"; done
      - name: make test (implementations the runner's CPU lacks are skipped)
        run: |
          set -o pipefail
          make CFLAGS="$WARN_CFLAGS" test 2>&1 | tee make-test.log || {
            echo "::error title=make test failed::$(tail -n 40 make-test.log | sed -e ':a;N;$!ba' -e 's/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            exit 1; }
      - name: make test, portable path forced
        run: PIKASEKO256_FORCE_PORTABLE=1 make CFLAGS="$WARN_CFLAGS" test
      - name: make PORTABLE=1 test
        run: make clean && make PORTABLE=1 CFLAGS="$WARN_CFLAGS" test
      - name: Python reference against the test vectors
        if: matrix.cc == 'gcc'
        run: make test-python
      - name: CMake + ctest
        run: |
          cmake -S . -B build/cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build/cmake -j "$(nproc)"
          ctest --test-dir build/cmake --output-on-failure
      - name: CMake + ctest, PIKASEKO256_SIMD=OFF
        run: |
          cmake -S . -B build/cmake-portable -DPIKASEKO256_SIMD=OFF
          cmake --build build/cmake-portable -j "$(nproc)"
          ctest --test-dir build/cmake-portable --output-on-failure

  sanitizers:
    name: ASan + UBSan (${{ matrix.cc }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
      SAN_CFLAGS: -O1 -g -std=c11 -Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
      SAN_LDFLAGS: -fsanitize=address,undefined
    steps:
      - uses: actions/checkout@v5
      # The AVX-512 path is tested only when the runner's CPU supports it (detected at run time).
      - name: make test
        run: make CFLAGS="$SAN_CFLAGS" LDFLAGS="$SAN_LDFLAGS" test
      - name: make test, portable path forced
        run: PIKASEKO256_FORCE_PORTABLE=1 make CFLAGS="$SAN_CFLAGS" LDFLAGS="$SAN_LDFLAGS" test

  fuzz:
    name: libFuzzer (clang, ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: make fuzz (every implementation the runner's CPU has, against portable)
        run: make fuzz FUZZTIME=120

  arm64:
    name: arm64 (${{ matrix.cc }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v5
      - name: Install clang if missing
        if: matrix.cc == 'clang'
        run: command -v clang || (sudo apt-get update && sudo apt-get install -y clang)
      - name: make test (ARMv8 AES and portable)
        run: |
          set -o pipefail
          make CFLAGS="$WARN_CFLAGS" test 2>&1 | tee make-test.log || {
            echo "::error title=make test failed::$(tail -n 40 make-test.log | sed -e ':a;N;$!ba' -e 's/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            exit 1; }
      - name: make test, portable path forced
        run: PIKASEKO256_FORCE_PORTABLE=1 make CFLAGS="$WARN_CFLAGS" test
      - name: make PORTABLE=1 test
        run: make clean && make PORTABLE=1 CFLAGS="$WARN_CFLAGS" test
      - name: CMake + ctest
        run: |
          cmake -S . -B build/cmake
          cmake --build build/cmake -j "$(nproc)"
          ctest --test-dir build/cmake --output-on-failure

  windows:
    name: Windows MSVC
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: CMake + ctest (x86 implementations and portable)
        run: |
          cmake -S . -B build/msvc -A x64
          cmake --build build/msvc --config Release
          ctest --test-dir build/msvc -C Release --output-on-failure
      - name: CMake + ctest, PIKASEKO256_SIMD=OFF
        run: |
          cmake -S . -B build/msvc-portable -A x64 -DPIKASEKO256_SIMD=OFF
          cmake --build build/msvc-portable --config Release
          ctest --test-dir build/msvc-portable -C Release --output-on-failure

  s390x:
    name: s390x big-endian portable (qemu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install cross compiler and qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-s390x-linux-gnu libc6-dev-s390x-cross qemu-user
      - name: make test under qemu-s390x
        run: >
          make PORTABLE=1 CC=s390x-linux-gnu-gcc AR=s390x-linux-gnu-ar
          CFLAGS="$WARN_CFLAGS" LDFLAGS=-static RUN=qemu-s390x test
